<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrícula / Login - EvolveFitness</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="imagens/logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&display=swap" rel="stylesheet">

</head>
<body class="login">

    <h2 class="titulo-login" id="titulo-login">Faça Sua Matrícula</h2>

    <div class="container-matricula">
        
        <div class="login-imagem">
            <div class="sombra"></div>
            <div class="conteudo">
                <h1>Transforme seu corpo,</h1>
                <h2 class="subtitulo">transforme sua vida</h2>
            </div>
            <a href="index.html" class="bnt-inicial" id="btn-pginicial">Página Inicial</a>
        </div>

        <div class="login-formulario">
            
            <div class="formulario-container" id="matricula">
                <h3>Dados Pessoais</h3>
                <form>
                    <div class="form-matricula">
                        <div class="grupo-form">
                            <label for="nome">Nome completo*</label>
                            <input type="text" id="nome" placeholder="Seu nome completo">
                        </div>
                        <div class="grupo-form">
                            <label for="email">E-mail*</label>
                            <input type="email" id="email" placeholder="seuemail@email.com">
                        </div>
                        <div class="grupo-form">
                            <label for="telefone">Telefone*</label>
                            <input type="tel" id="telefone" placeholder="(21)99999-9999">
                        </div>
                        <div class="grupo-form">
                            <label for="cpf">CPF*</label>
                            <input type="text" id="cpf" placeholder="000.000.000-00">
                        </div>
                        <div class="grupo-form">
                            <label for="nascimento">Data de Nascimento*</label>
                            <input type="text" id="nascimento" placeholder="dd/mm/aaaa">
                        </div>
                        <div class="grupo-form">
                            <label for="endereco">Endereço completo*</label>
                            <input type="text" id="endereco" placeholder="Rua, Número, Bairro, Cidade">
                        </div>
                        <div class="grupo-form saude">
                            <label for="historico">Histórico de Saúde*</label>
                            <textarea id="historico" placeholder="Informe condições médicas, lesões, cirurgias ou medicamentos."></textarea>
                        </div>
                    </div>
                    <button type="submit" class="btn-form">Próximo</button>
                </form>
                <p class="cadastro">Ou já possui cadastro? <a href="#" onclick="mostrarAba('login'); return false;">Login</a></p>
            </div>

            <div class="formulario-container" id="login" style="display: none;">
                <h2 class="titulo-loginf">Login</h2>
                <form>
                    <div class="login-form">
                        <label for="login-matricula">Matrícula</label>
                        <input type="text" id="login-matricula" placeholder="0000-0000">
                    </div>
                    <div class="login-form">
                        <label for="login-senha">Senha</label>
                        <input type="password" id="login-senha" placeholder="Sua senha">
                    </div>
                    <button type="submit" class="botao-form">Login</button>
                </form>
                <p class="criar-conta">Não tem conta? <a href="#" onclick="mostrarAba('matricula'); return false;">Criar Matrícula</a></p>
                <a href="index.html" class="btn-inicio">Página Inicial</a>
            </div>

        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
